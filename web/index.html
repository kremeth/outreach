<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Outreach</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="view-home" class="view" hidden>
      <header class="home-head">
        <div id="today" class="kicker"></div>
        <h1>To do</h1>
        <div id="safety" class="safety"></div>
        <div id="home-warn" class="home-warn"></div>
      </header>
      <main class="home-main">
        <section id="usage" class="usage" aria-label="API costs"></section>
        <div class="section-label">Prospecting</div>
        <div id="prospect-card" class="tasks"></div>
        <div class="section-label daily-label">Daily</div>
        <div id="sync" class="sync"></div>
        <div id="launch" class="launch"></div>
        <div id="tasks" class="tasks"></div>
      </main>
    </div>

    <div id="view-prospect" class="view" hidden>
      <header>
        <a class="back" href="#/">← To do</a>
        <div id="track" class="track"></div>
        <div class="top-row">
          <div class="who">
            <div id="kicker" class="kicker"></div>
            <h1 id="name"></h1>
            <p id="meta" class="meta"></p>
            <p id="notes" class="notes"></p>
          </div>
          <div class="corner">
            <div id="status" class="status"></div>
            <button id="undo" type="button" aria-label="Undo" title="Undo" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path d="M8 8.5H15.2a4.3 4.3 0 1 1 0 8.6H11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M11.2 5.4 L7.2 8.5 L11.2 11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </header>
      <main>
        <section id="stage" class="stage"></section>
      </main>
      <footer>
        <div id="q" class="q">Keep this profile?</div>
        <div id="review-actions" class="actions">
          <button id="no" type="button">No</button>
          <button id="yes" type="button">Yes</button>
        </div>
        <div id="device-actions" class="actions devices" hidden></div>
        <div class="sub">
          <button id="prev" type="button">Previous</button>
          <span id="keys">N no · Y yes</span>
          <a id="fileline" href="/voicenote-yes.csv"></a>
        </div>
      </footer>
    </div>

    <div id="view-task" class="view" hidden></div>

    <script src="/app.js"></script>
    <script src="/tasks.js"></script>
  </body>
</html>
