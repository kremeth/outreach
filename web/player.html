<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Voice note</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #10110f;
        color: #f4f4f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: min(420px, calc(100% - 48px));
      }
      .kicker {
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #8d8d84;
      }
      h1 {
        margin: 6px 0 0;
        font-size: 28px;
        line-height: 1.15;
        letter-spacing: -0.03em;
        font-weight: 650;
      }
      p {
        margin: 8px 0 0;
        color: #8d8d84;
        font-size: 14px;
      }
      audio {
        width: 100%;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="kicker">Voice note</div>
      <h1 id="label">Ready</h1>
      <p>Silent preview. Instagram gets this audio through the microphone route.</p>
      <audio id="v" src="voice://note/recording.m4a" preload="auto" controls></audio>
    </div>
  </body>
</html>
