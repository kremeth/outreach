<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Send</title>
    <link rel="stylesheet" href="record-bar.css" />
  </head>
  <body>
    <div class="bar">
      <div class="copy">
        <div id="title">Voicenote send</div>
        <div id="status">Loading…</div>
      </div>
      <div id="meta"></div>
      <button id="pause" type="button">Pause</button>
      <button id="skip" type="button">Skip</button>
      <button id="retry" type="button" hidden>Retry</button>
      <button id="cancel" type="button" hidden>Cancel</button>
      <button id="record" type="button" disabled>Send</button>
    </div>
    <script src="record-bar.js"></script>
  </body>
</html>
